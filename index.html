
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Manage your money wisely!</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>My Budget</h2>
            <input type="number" id="budget" placeholder="Enter your budget">
            <button id="setBudget">Set Budget</button>

            <h3>Total Budget: KES <span id="totalBudget">0</span></h3>
            <h3>Total Expenses: KES <span id="totalExpenses">0</span></h3>
            <h3>Remaining Balance: KES <span id="balance">0</span></h3>

            <p id="message">Set your budget to get started.</p>
        </section>

        <section class="expense-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName" placeholder="Expense name" required>

                <input type="number" id="expenseAmount" placeholder="Amount (KES)" min="1" required>

                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section>
            <h2>Expense History</h2>
            <ul id="expenseList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
